resources:
  apps:
    content_app:
      name: content-assistant
      description: "Editor Search + Partner Assistant on Lakebase (pgvector + full-text)"
      source_code_path: ../app
      resources:
        - name: postgres
          postgres:
            branch: ${var.lakebase_branch}
            database: ${var.lakebase_database}
            permission: CAN_CONNECT_AND_CREATE
        - name: embedding-endpoint
          serving_endpoint:
            name: ${var.embedding_endpoint}
            permission: CAN_QUERY
        - name: llm-endpoint
          serving_endpoint:
            name: ${var.llm_endpoint}
            permission: CAN_QUERY
        - name: partner-llm-endpoint
          serving_endpoint:
            name: ${var.partner_llm_endpoint}
            permission: CAN_QUERY
